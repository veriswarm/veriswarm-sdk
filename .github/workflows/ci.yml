name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify package builds
        run: |
          pip install build
          python -m build
      - name: Install package with test extras
        run: pip install -e '.[langchain,webbotauth]' pytest
      - name: Run tests
        run: python -m pytest -q

  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify package
        run: npm pack --dry-run
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build
      - name: Verify package builds
        run: python -m build
      - name: Install package with test deps
        run: pip install -e . pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest -q

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package with test deps
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  github-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-action
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -q

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON schemas
        run: python3 -c "import json,glob,sys;[json.load(open(f)) for f in glob.glob('schemas/*.json')];print('All schemas valid')"
