name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify package builds
        run: |
          pip install build
          python -m build
      - name: Install package with test extras
        run: pip install -e '.[langchain,webbotauth]' pytest
      - name: Run tests
        run: python -m pytest -q

  python-sdk-py38:
    # Oldest Python the package declares (requires-python >= 3.8).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.8'
      - name: Install package with test extras
        run: pip install -e '.[webbotauth]' pytest
      - name: Run tests
        run: python -m pytest -q

  node-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify package
        run: npm pack --dry-run
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build
      - name: Verify package builds
        run: python -m build
      - name: Install package with test deps
        run: pip install -e . pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest -q

  openclaw-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package with test deps
        run: pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  github-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-action
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -q

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install script deps
        run: pip install jsonschema pytest
      - name: Validate JSON schemas
        run: python scripts/validate_schemas.py
      - name: Test JSON schemas against API-shaped payloads
        run: python -m pytest -q schemas/tests/test_schemas.py
      - name: Test release guard script
        run: python -m pytest -q scripts/test_check_release_version.py
      - name: Check vendored secret manifests for drift
        run: node scripts/check_secret_manifest.mjs
      - name: Lint workflows (actionlint)
        run: >-
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
