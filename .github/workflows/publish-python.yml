name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard release ref and version
        working-directory: .
        run: python3 scripts/check_release_version.py python "$GITHUB_REF"

      - name: Require tagged commit to be on main
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit is not reachable from main"; exit 1; }


      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with test extras
        run: pip install -e '.[langchain,webbotauth]' pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
