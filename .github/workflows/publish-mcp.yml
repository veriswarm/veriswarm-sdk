name: Publish MCP Server to PyPI

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp-server
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard release ref and version
        id: version
        working-directory: .
        run: |
          VERSION="$(python3 scripts/check_release_version.py mcp "$GITHUB_REF")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require tagged commit to be on main
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit is not reachable from main"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package with test deps
        run: pip install -e . pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: mcp-server/dist/

  publish-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar -xz mcp-publisher

      - name: Wait for PyPI to expose the new release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL "https://pypi.org/pypi/veriswarm-mcp/${VERSION}/json" >/dev/null 2>&1; then
              echo "veriswarm-mcp ${VERSION} is live on PyPI."
              exit 0
            fi
            echo "Attempt $i: ${VERSION} not on PyPI yet, retrying in 15s..."
            sleep 15
          done
          echo "PyPI did not expose ${VERSION} in time." >&2
          exit 1

      - name: Login to MCP Registry (keyless OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
