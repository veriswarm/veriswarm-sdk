name: Publish Node.js SDK to npm

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard release ref and version
        working-directory: .
        run: python3 scripts/check_release_version.py node "$GITHUB_REF"

      - name: Require tagged commit to be on main
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit is not reachable from main"; exit 1; }


      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify package
        run: npm pack --dry-run

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC id-token for a
      # short-lived registry credential via the package's trusted publisher.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public --provenance
