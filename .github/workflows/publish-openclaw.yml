name: Publish OpenClaw Plugin to npm

on:
  push:
    tags:
      - 'openclaw-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: openclaw-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard release ref and version
        working-directory: .
        run: python3 scripts/check_release_version.py openclaw "$GITHUB_REF"

      - name: Require tagged commit to be on main
        working-directory: .
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tagged commit is not reachable from main"; exit 1; }


      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
